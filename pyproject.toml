[tool.ruff]
line-length = 88                      # 与 Black 保持一致的代码行宽
target-version = "py311"              # 目标Python版本，按需修改

[tool.ruff.lint]
select = [                           # 要启用的规则集
    "E", "F", "W",                   # pycodestyle, Pyflakes, pyupgrade
    "I",                             # isort (import排序)
    "N",                             # pep8-naming
    "UP",                            # pyupgrade
    "B",                             # flake8-bugbear
]
ignore = [                           # 需要忽略的规则
    "E501",                          # 行过长由formatter处理
]

[tool.ruff.format]
quote-style = "double"               # 使用双引号
indent-style = "space"               # 缩进使用空格
skip-magic-trailing-comma = false    # 保留“魔法逗号”风格

[tool.ruff.lint.isort]
known-first-party = ["app"]          # 将你的项目代码包视为第一方
